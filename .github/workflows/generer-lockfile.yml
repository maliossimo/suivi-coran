name: Générer package-lock.json (outil temporaire)
on:
  push:
    branches: ["outil/package-lock"]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Déposer le fichier sur la branche outil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Génère package-lock.json" || echo "rien à déposer"
          git push
