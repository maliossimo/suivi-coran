name: Publication de la version

# À chaque mise en production : étiquette vX.Y.Z sur le commit déployé et « Release » GitHub
# avec les notes de CHANGELOG.md. Rien n'est fait si la version est déjà publiée.
on:
  push:
    branches: [prod]

permissions:
  contents: write

jobs:
  publier:
    name: Étiquette et notes de version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version déjà publiée."
            exit 0
          fi
          # Notes : la section de cette version dans CHANGELOG.md.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { dedans = 1; next }
            dedans && /^## \[/ { exit }
            dedans { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Mise en production de la version $version." > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "Version $version" --notes-file notes.md
