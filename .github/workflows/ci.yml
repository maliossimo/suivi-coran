name: CI

# Une seule vérification par PR (vers main ou vers prod) : le contenu qui arrive ensuite
# sur main ou prod est exactement celui qui a été vérifié. Relance manuelle possible.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Qualité, types et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installation
        run: npm ci --no-audit --no-fund
      # Refuse une dépendance de production avec une faille connue critique.
      # (Seuil « critical » tant que les mises à jour majeures de zod et next, qui corrigent
      # deux failles « high » connues, ne sont pas faites ; le rapport complet reste visible ici.)
      - name: Failles connues dans les dépendances
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical
      # En cas d'écart de mise en forme, affiche les changements attendus (à appliquer tels quels).
      - name: Mise en forme
        run: |
          if ! npm run format:check; then
            npx prettier --write . >/dev/null
            git --no-pager diff
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  tajwid:
    name: Moteur tajwid (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Le moteur (modèle téléchargé, récitations de référence) n'est testé que si la PR le touche.
      - name: La PR touche-t-elle le moteur ?
        id: changements
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(api/|tests_python/|requirements\.txt)'; then
            echo "moteur=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun changement du moteur tajwid : tests inutiles."
          fi
      - uses: actions/setup-python@v6
        if: steps.changements.outputs.moteur == 'oui'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installation
        if: steps.changements.outputs.moteur == 'oui'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt pytest
      - name: Tests (dont l'analyse réelle de récitations de référence)
        if: steps.changements.outputs.moteur == 'oui'
        env:
          TAJWID_REEL: "1"
        run: python -m pytest tests_python -v -s

  base:
    name: Migrations et règles d'accès (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # La base (plusieurs minutes à démarrer) n'est testée que si la PR touche supabase/.
      - name: La PR touche-t-elle la base ?
        id: changements
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^supabase/'; then
            echo "base=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun changement dans supabase/ : tests de la base inutiles."
          fi
      - uses: supabase/setup-cli@v3
        if: steps.changements.outputs.base == 'oui'
        with:
          version: latest
      - name: Démarrer PostgreSQL Supabase et appliquer les migrations
        if: steps.changements.outputs.base == 'oui'
        run: supabase db start
      - name: Tests des règles d'accès
        if: steps.changements.outputs.base == 'oui'
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql

  build:
    name: Build de production
    runs-on: ubuntu-latest
    needs: qualite
    env:
      # Valeurs factices : le build vérifie que l'application compile, sans se connecter.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-000000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installation
        run: npm ci --no-audit --no-fund
      - run: npm run build
