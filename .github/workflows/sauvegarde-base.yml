name: Sauvegarde de la base

# Chaque nuit, copie complète de la base de production (structure, rôles, données
# — y compris les comptes de connexion), conservée 30 jours dans les « artifacts » du dépôt.
# Le dépôt est public : les artifacts sont téléchargeables par tout compte GitHub.
# La sauvegarde est donc TOUJOURS chiffrée (secret SAUVEGARDE_PHRASE) ; sans phrase, elle échoue
# au lieu de publier les données en clair.
# Restauration : voir README, section « Sauvegardes ».
on:
  schedule:
    - cron: "17 2 * * *" # 3 h 17 à Paris (heure d'hiver)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sauvegarde-base
  cancel-in-progress: false

jobs:
  sauvegarde:
    name: Sauvegarde de la production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SAUVEGARDE_PHRASE: ${{ secrets.SAUVEGARDE_PHRASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Vérifier la configuration
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SAUVEGARDE_PHRASE; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant (voir README)"; exit 1; fi
          done
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Exporter la base
        run: |
          mkdir sauvegarde
          supabase db dump --linked --role-only -f sauvegarde/roles.sql
          supabase db dump --linked -f sauvegarde/schema.sql
          supabase db dump --linked --data-only --use-copy --schema public,auth -f sauvegarde/donnees.sql
          ls -la sauvegarde
      - name: Archiver et chiffrer
        run: |
          nom="sauvegarde-$(date -u +%Y-%m-%d)"
          tar czf "$nom.tar.gz" -C sauvegarde .
          printf '%s' "$SAUVEGARDE_PHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$nom.tar.gz.gpg" "$nom.tar.gz"
          rm -rf sauvegarde "$nom.tar.gz"
          echo "FICHIER=$nom.tar.gz.gpg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FICHIER }}
          path: ${{ env.FICHIER }}
          retention-days: 30
          if-no-files-found: error
      # Notée dans la base pour que l'administration affiche la date de la dernière sauvegarde.
      # Un échec ici ne fait pas échouer la sauvegarde elle-même.
      - name: Noter la sauvegarde dans la base
        continue-on-error: true
        run: |
          taille=$(stat -c %s "$FICHIER")
          chiffree=true
          curl -sfS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"insert into public.sauvegardes (chiffree, taille_octets) values ($chiffree, $taille)\"}"
