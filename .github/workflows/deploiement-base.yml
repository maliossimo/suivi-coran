name: Déploiement de la base

# Applique les migrations Supabase quand elles arrivent sur prod (mise en production).
# Le site lui-même est déployé par Vercel : prod → production, main et PR → prévisualisation.
on:
  push:
    branches: [prod]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploiement-base
  cancel-in-progress: false

jobs:
  migrations:
    name: Migrations → production
    runs-on: ubuntu-latest
    # L'environnement « production » peut exiger ton approbation manuelle (Settings → Environments).
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Le commit vient d'une PR main → prod
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub met quelques secondes à relier un commit de fusion à sa PR : on réessaie.
          for essai in 1 2 3 4 5 6; do
            ok=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "prod" and .head.ref == "main")] | length')
            [ "$ok" != "0" ] && break
            sleep 10
          done
          if [ "$ok" = "0" ]; then
            echo "::error::Migrations non appliquées : ce commit n'est pas arrivé sur prod par une PR depuis main."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Vérifier la configuration
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant (voir README)"; exit 1; fi
          done
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --remote --yes
