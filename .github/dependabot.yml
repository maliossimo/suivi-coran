# Surveillance des dépendances : chaque semaine, Dependabot propose (en PR vers main)
# les mises à jour, et tout de suite celles qui corrigent une faille connue.
# Les PR passent par les mêmes vérifications que les autres ; fusion puis mise en production
# comme d'habitude (avec une nouvelle version CORRECTIF).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    target-branch: main
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Met à jour"
    labels: [dependances]
    groups:
      # Les petites mises à jour ensemble, pour limiter le nombre de PR.
      mineures-et-correctifs:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: main
    commit-message:
      prefix: "Met à jour"
    labels: [dependances]
    groups:
      actions:
        patterns: ["*"]
